[workspace]
resolver = "3"
members = [
    "foxtive-axum"
]

[workspace.dependencies]
tracing = "0.1.44"
futures = "0.3.34"
serde = { version = "1.0.229", default-features = false }
serde_json = { version = "1.0.151", default-features = false }
thiserror = { version = "2.0.21", default-features = false }
axum = { version = "0.8.9", default-features = false }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }

foxtive = { version = "1.4.0", default-features = false, features = ["tracing-setup"] }
